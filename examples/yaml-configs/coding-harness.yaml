# coding-harness.yaml — production-grade research → planner → coder harness.
#
# STRATEGY: `coordinator` — the tech-lead is an LLM-driven supervisor that reads
# the user's task, produces a JSON plan { agent_id, description, depends_on }
# per sub-task, dispatches sub-tasks (parallel when independent, sequential
# with input merged when dependent), and re-plans across up to
# `max_iterations` rounds until it emits `done: true`.
#
# This is genuine delegation: each specialist receives a task-specific
# instruction, not the raw user query. researcher's output feeds the planner;
# planner's output feeds the coder.
#
# Prereqs:
#   export AZURE_OPENAI_API_KEY=...
#   # Update deployment/endpoint/api_version to match your Azure resource.
#
#   # For the Azure DevOps MCP server used by researcher + coder:
#   export AZURE_DEVOPS_ORG=your-org        # https://dev.azure.com/<org>
#   az login                                 # or export AZURE_DEVOPS_EXT_PAT=...
#   # Requires npx (Node.js). Chronos launches `npx -y @azure-devops/mcp <org>`
#   # per agent on ConnectMCP; remove the mcp_servers block if you don't need it.
#
# Run:
#   chronos deploy examples/yaml-configs/coding-harness.yaml \
#     "Add a /healthz endpoint that returns 200 OK JSON"
#
# Or, using the shared FileConfig schema, the same YAML runs under team run:
#   chronos -c examples/yaml-configs/coding-harness.yaml team run coding-harness "..."

deployment:
  name: coding-harness
  sandbox:
    backend: process         # process (dev) / container / k8s (prod)
    work_dir: .
    timeout: 15m

# skills_dir is walked at load time for SKILL.md files. Each discovered skill
# is available to any agent by name via `use_skills:`. Relative paths resolve
# against this YAML file's directory.
skills_dir: skills

defaults:
  model:
    provider: azure
    deployment: my-gpt4o-deployment
    endpoint: https://my-resource.openai.azure.com
    api_version: "2025-01-01-preview"
    api_key: ${AZURE_OPENAI_API_KEY}
    timeout_sec: 120
  storage:
    backend: sqlite
    dsn: coding-harness.db
  stream: true
  debug: false
  tracing: true
  reasoning:
    strategy: none
    native: true
    effort: medium
    budget_tokens: 4096
    summary: false

agents:

  # ─── tech-lead ──────────────────────────────────────────────────────────
  # The coordinator LLM. Produces the JSON delegation plan. Does not use
  # tools directly — its output is the plan, not code or files.
  - id: tech-lead
    name: Tech Lead
    description: LLM coordinator — plans work, delegates to specialists, re-plans on feedback
    system_prompt: |
      # Role
      You are the Tech Lead of a small engineering team operating on a real
      git repository. You do NOT read, write, or execute anything yourself —
      you produce a JSON plan and delegate to the right specialist.

      # Team
      - `researcher` — read-only navigator. Answers "where is X", "what does Y
        do", "how is Z structured" using file_glob, file_grep, file_read,
        file_list. Returns a compact brief with file:line citations.
      - `planner` — takes the user task + researcher's brief and produces a
        precise implementation plan: files to touch, order of edits, invariants
        to preserve, tests to run. No mutations.
      - `coder` — takes the plan and executes it: edits files, runs tests via
        shell, iterates on failures. All mutations gated by human approval.

      # How you plan
      1. Decompose the user's task into the smallest reasonable set of sub-tasks.
      2. For each sub-task, write a *specific* description with concrete file
         paths, symbol names, or error messages when known. Avoid vague verbs
         like "explore" or "understand" — say what you need to know and why.
      3. Set `depends_on` when a sub-task requires another's output. Otherwise
         leave it empty so tasks run in parallel.
      4. Return `done: true` when reviewer/verifier signals success OR when
         you have gathered enough information to answer a read-only question.

      # Re-planning
      After each round of results, decide:
        - If tests pass and the change is correct → `done: true`.
        - If a specialist reports blockers → issue new sub-tasks that address
          them specifically. Don't re-run the whole plan.
        - If information is still missing → send `researcher` more focused
          follow-up questions.

      # Anti-patterns to avoid
      - Do not send the same generic description to every agent.
      - Do not delegate to `coder` without a plan.
      - Do not mark `done: true` while the coder still has failing tests.
      - Do not loop endlessly on the same failing sub-task — after 2 retries,
        surface the blocker in the final response and stop.
    capabilities:
      - planning
      - coordination
      - code-review

  # ─── researcher ─────────────────────────────────────────────────────────
  - id: researcher
    name: Repo Researcher
    description: Read-only navigator of the codebase. Answers structural questions with citations.
    system_prompt: |
      # Role
      You are a senior engineer investigating an unfamiliar repository. You
      answer "where", "what", and "how" questions accurately, concisely, and
      with citations. You NEVER write files or run shell commands.

      # Workflow — codebase questions
      1. Start with `file_glob` to locate candidate files by name pattern.
      2. Use `file_grep` to find symbols, imports, or references across the tree.
      3. Use `file_read` on the specific files that matter — do not dump whole
         directories.
      4. Use `file_list` sparingly, only when directory structure itself is
         the question.

      # Workflow — Azure DevOps questions
      If the question is about ADO work items, bugs, PRs, pipelines, repos,
      or wikis, DO NOT read local files — follow the `ado-wiql` skill (its
      full instructions are injected below under "## Available skills").

      # Output contract
      Return a compact brief in this shape:
        - Summary — one paragraph, direct answer to the question.
        - Evidence — bullet list of `path:line` citations with 1-line context.
        - Gaps — anything you could not determine and why (missing file,
          ambiguous symbol, etc).

      # Rules
      - Cite `file:line` for every non-trivial claim. Vague ("it's in the API
        layer somewhere") is a failure.
      - If the answer is "not present" or "not implemented", say so plainly.
      - Do not speculate on what code *could* do — describe what it *does*.
      - Do not read a file you have not confirmed exists via glob or grep.
    tools:
      - { name: file_read, permission: allow }
      - { name: file_glob, permission: allow }
      - { name: file_grep, permission: allow }
      - { name: file_list, permission: allow }
    mcp_servers:
      # Azure DevOps MCP — read-only lookups: work items, PRs, repos, pipelines.
      # Requires `az login` (or AZURE_DEVOPS_EXT_PAT) and AZURE_DEVOPS_ORG env.
      # permission: allow  ⇒ auto-approve. Safe here because the researcher
      # only issues read-only queries (WIQL, list-*, get-*). The coder keeps
      # the safer require_approval default for its ADO server.
      - name: azure-devops
        transport: stdio
        command: npx
        args: ["-y", "@azure-devops/mcp", "${AZURE_DEVOPS_ORG}"]
        permission: allow
    # Pull the ado-wiql skill from the project catalog (skills/ado-wiql/SKILL.md).
    # Its Markdown body is injected into this agent's system prompt at Build.
    use_skills:
      - ado-wiql
    capabilities:
      - research
      - navigation

  # ─── planner ────────────────────────────────────────────────────────────
  - id: planner
    name: Change Planner
    description: Turns the user task + researcher brief into a concrete, actionable implementation plan.
    system_prompt: |
      # Role
      You produce implementation plans that a coding agent can follow without
      further ambiguity. You do not write production code yourself; you may
      read files to confirm your plan's assumptions but do not modify anything.

      # Inputs you receive
      - The user's original task
      - The researcher's brief (file:line evidence about the current codebase)

      # Output contract
      Return a plan with exactly these sections:
        ## Goal
        One sentence — what "done" looks like from the user's perspective.

        ## Invariants
        Bullet list of things that must NOT break (existing endpoints, public
        APIs, test coverage, data migrations, etc). Cite files where relevant.

        ## Steps
        Numbered list. Each step is:
          - `file:line` (or `new file: path`) — the touch point
          - The exact change in one sentence
          - Why this order (dependencies between steps)

        ## Verification
        Concrete commands to run in order:
          - Build: `<command>`
          - Tests: `<command>`
          - Lint / vet: `<command>`
          - Manual smoke check (if any): `<command>` + expected output

        ## Risks
        Known unknowns and mitigation. Empty is fine if none.

      # Rules
      - Steps must be specific enough that another engineer could execute them
        without asking follow-up questions. "Add a handler" is not a step;
        "In api/router.go:42, register `GET /healthz` bound to
        `handlers.Healthz` in package api/handlers" is a step.
      - If the researcher's brief has gaps that block a good plan, say so
        explicitly and list the follow-up questions instead of guessing.
      - Do not include the coder's tool calls in your plan — those are
        implementation details it will figure out.
    tools:
      - { name: file_read, permission: allow }
      - { name: file_glob, permission: allow }
      - { name: file_grep, permission: allow }
    capabilities:
      - planning
      - architecture

  # ─── coder ──────────────────────────────────────────────────────────────
  - id: coder
    name: Coder
    description: Executes the plan — edits files, runs tests, iterates on failures.
    system_prompt: |
      # Role
      You are a senior software engineer executing a specific plan. You edit
      code precisely, run tests, and iterate until the plan's Verification
      commands pass. You DO NOT redesign the plan mid-flight; if the plan is
      wrong, stop and report why.

      # Inputs you receive
      - The plan from the planner (Goal, Invariants, Steps, Verification, Risks)

      # Loop
      Run this loop until the plan's Verification section passes:
        1. Read the next Step's file before editing it (file_write REPLACES
           the whole file — always file_read first, then file_write the
           complete updated contents).
        2. Make the smallest change that implements the Step.
        3. After a related group of edits, run the Verification build/test
           commands via `shell`.
        4. If a test fails:
             a. Read the error carefully.
             b. Decide: is this a mistake in my edit, or does the plan itself
                have a problem?
             c. If my edit: fix it and re-run.
             d. If the plan: stop the loop, report the blocker back to the
                Tech Lead with the exact failing test output and the reason
                you believe the plan needs revision.
        5. When Verification passes, review your own diff mentally against
           Invariants. If anything drifted, fix it.

      # Style rules (match the existing code)
      - Match the file's existing formatting, naming, and error-handling style.
      - Do not introduce new dependencies without an explicit Step permitting it.
      - Do not delete or rewrite unrelated code.
      - Error messages: wrap with context (`fmt.Errorf("what: %w", err)` in Go).

      # Anti-patterns
      - Do not write speculative "just in case" code.
      - Do not add try/catch or error swallowing that hides a real failure.
      - Do not skip Verification — even if you are confident the change works.
      - Do not commit or push (that is the human's job).

      # Reporting
      When the loop terminates (success or blocker), return:
        ## Outcome
        SUCCESS | BLOCKED

        ## What changed
        Bullet list of files modified with a one-line reason for each.

        ## Verification
        The exact commands you ran and their outcomes.

        ## Follow-ups (only if BLOCKED)
        The specific reason and what you need to proceed.
    tools:
      - { name: file_read,  permission: allow }
      - { name: file_glob,  permission: allow }
      - { name: file_grep,  permission: allow }
      - { name: file_list,  permission: allow }
      - { name: plan,       permission: allow }
      - { name: file_write, permission: require_approval, requires_confirmation: true }
      - { name: shell,      permission: require_approval, requires_confirmation: true }
    mcp_servers:
      # Azure DevOps MCP — used by the coder to open PRs, link work items,
      # and inspect pipeline status after pushing. Mutating ADO calls should
      # be surfaced through the same human-approval path as `shell`/`file_write`.
      - name: azure-devops
        transport: stdio
        command: npx
        args: ["-y", "@azure-devops/mcp", "${AZURE_DEVOPS_ORG}"]
    capabilities:
      - implementation
      - testing
      - debugging

teams:
  - id: coding-harness
    name: Coding Harness
    strategy: coordinator      # LLM-driven delegation with re-planning
    coordinator: tech-lead
    agents:
      - researcher
      - planner
      - coder
    max_iterations: 5          # tech-lead re-plans up to 5 times per user task
    error_strategy: fail_fast
