{{- /*
Production secret path. Requires the External Secrets Operator
(https://external-secrets.io) CRDs. Materialises the Secret named
`secrets.name` from an external provider (Vault, AWS/GCP/Azure secret managers).
Pair with secrets.create=false so no plaintext Secret is rendered.
*/ -}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: chronos-secrets
  labels:
    app: chronos-os
    app.kubernetes.io/name: chronos
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.secrets.name | default "chronos-secrets" }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
