{{- /*
DEV-ONLY Secret. Rendered only when secrets.create=true. This materialises
credentials from plaintext Helm values (b64-encoded, NOT encrypted) and MUST
NOT be used in production. For production, set secrets.create=false and supply
the Secret via externalSecret.enabled=true (External Secrets Operator) or an
out-of-band mechanism (SOPS, Vault Agent, sealed-secrets).
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default "chronos-secrets" }}
  labels:
    app: chronos-os
    app.kubernetes.io/name: chronos
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    chronos.io/secret-source: "helm-values-plaintext-dev-only"
type: Opaque
data:
  storage-dsn: {{ .Values.secrets.storageDSN | b64enc | quote }}
  {{- if .Values.secrets.apiKey }}
  api-key: {{ .Values.secrets.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.embeddingsKey }}
  embeddings-key: {{ .Values.secrets.embeddingsKey | b64enc | quote }}
  {{- end }}
{{- end }}
