# Materialises the `chronos-secrets` Secret from an external provider (Vault,
# AWS/GCP/Azure secret managers) via External Secrets Operator. No plaintext
# secrets are ever committed. The SecretStore/ClusterSecretStore referenced
# here is provisioned out-of-band (per cloud) — see terraform/modules/*.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: chronos-secrets
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app: chronos-os
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: chronos-secret-store
    kind: ClusterSecretStore
  target:
    name: chronos-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # Writes → primary (via PgBouncer -rw). Required.
    - secretKey: storage-dsn
      remoteRef:
        key: chronos/storage
        property: dsn
    # Reads → replicas (via PgBouncer -ro). Optional read-offload DSN.
    - secretKey: storage-dsn-ro
      remoteRef:
        key: chronos/storage
        property: dsn_ro
    # Shared rate-limit / scheduler-lease / approval fan-out.
    - secretKey: redis-url
      remoteRef:
        key: chronos/redis
        property: url
    # API keys (used only when CHRONOS_AUTH=apikey).
    - secretKey: api-keys
      remoteRef:
        key: chronos/api
        property: keys
