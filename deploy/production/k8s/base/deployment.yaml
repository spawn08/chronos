apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-os
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: control-plane
    app: chronos-os
spec:
  # replicas is owned by the HPA/KEDA ScaledObject at runtime; the value here
  # is only the initial count before the autoscaler takes over.
  replicas: 12
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chronos-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chronos
        app.kubernetes.io/component: control-plane
        app: chronos-os
      annotations:
        # Force a rollout when config/secret change (patched by CI or kustomize).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8420"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chronos-os
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway   # tightened to DoNotSchedule in prod overlay
          labelSelector:
            matchLabels:
              app: chronos-os
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: chronos-os
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: chronos-os
      containers:
        - name: chronos-os
          image: ghcr.io/spawn08/chronos:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", ":8420"]
          ports:
            - name: http
              containerPort: 8420
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chronos-os-config
          env:
            - name: CHRONOS_STORAGE_DSN
              valueFrom:
                secretKeyRef:
                  name: chronos-secrets
                  key: storage-dsn
            - name: CHRONOS_STORAGE_DSN_RO
              valueFrom:
                secretKeyRef:
                  name: chronos-secrets
                  key: storage-dsn-ro
                  optional: true
            - name: CHRONOS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chronos-secrets
                  key: redis-url
            - name: CHRONOS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: chronos-secrets
                  key: api-keys
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          # Startup probe covers slow cold starts (DB migrate/connect) so
          # liveness does not kill a still-initialising pod.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give the endpoints controller time to deregister this pod from
                # Service/LB before SIGTERM so no new traffic is routed here.
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
