apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chronos

commonLabels:
  app.kubernetes.io/name: chronos
  app.kubernetes.io/part-of: chronos

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - resourcequota.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  # The KEDA ScaledObject lives in overlays/prod/keda-scaledobject.yaml (not the
  # base) — the prod overlay adds it and removes hpa.yaml so the two autoscalers
  # never conflict. Base ships the portable plain HPA (hpa.yaml).

images:
  - name: ghcr.io/spawn08/chronos
    newTag: 0.1.0
