apiVersion: v1
kind: ConfigMap
metadata:
  name: chronos-os-config
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app: chronos-os
data:
  # Non-secret server configuration, injected as environment variables.
  # Secret values (DSN, JWT material, API keys) come from the Secret
  # `chronos-secrets` materialised by ExternalSecrets — never here.
  CHRONOS_STORAGE_BACKEND: "postgres"
  # Auth mode: jwt | apikey | off. Health & /metrics are always exempt.
  CHRONOS_AUTH: "jwt"
  CHRONOS_JWT_ISSUER: "https://issuer.example.com/"
  CHRONOS_JWT_AUDIENCE: "chronos-api"
  CHRONOS_JWT_JWKS_URL: "https://issuer.example.com/.well-known/jwks.json"
  # OpenTelemetry: OTLP/HTTP collector base endpoint. The server appends
  # /v1/traces and /v1/metrics (see os/trace, os/metrics).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4318"
  OTEL_SERVICE_NAME: "chronos-os"
  # pgx pool tuning appended to the DSN by the app / documented for operators.
  CHRONOS_PG_POOL_MAX_CONNS: "20"
  CHRONOS_PG_POOL_MIN_CONNS: "2"
