name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"

jobs:
  # ────────────────────────────────────────────────────────────
  # Lint
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        # Install with the job's Go (1.25.x) so the linter is built with a Go
        # >= the module's target version; the action's bundled binary can lag.
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run --timeout=5m

  # ────────────────────────────────────────────────────────────
  # Build & Test
  # ────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.25.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Run tests
        # -short skips the heavy engine/queue load/soak variants (timing-sensitive
        # load tests, not gates); everything else runs unchanged under -race.
        run: go test -race -count=1 -timeout 120s -short -coverprofile=coverage.out ./...

      - name: Check coverage threshold (enforced gate)
        if: matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_THRESHOLD: "10"
        run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${total}%"
          echo "Required threshold: ${COVERAGE_THRESHOLD}%"
          if (( $(echo "$total < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${total}% is below the required threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
          echo "Coverage gate passed: ${total}% >= ${COVERAGE_THRESHOLD}%"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Examples (smoke test)
  # ────────────────────────────────────────────────────────────
  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run quickstart example
        run: go run ./examples/quickstart/main.go

      - name: Run multi-agent example
        run: go run ./examples/multi_agent/main.go

      - name: Run multi-provider example
        run: go run ./examples/multi_provider/main.go

  # ────────────────────────────────────────────────────────────
  # Eval gate (WC-C-001): demonstrate the trace→dataset→eval→gate loop
  # blocks regressions. The job is green when the gate correctly passes a
  # healthy report and fails a regressed one.
  # ────────────────────────────────────────────────────────────
  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run the eval-loop example (capture → run → gate)
        run: go run ./examples/eval_loop/main.go

      - name: Gate passes a healthy report
        run: go run ./cli evals gate evals/testdata/report_baseline.json --min-score 0.9

      - name: Gate blocks a regression (must exit non-zero)
        run: |
          if go run ./cli evals gate evals/testdata/report_regressed.json --min-score 0.9; then
            echo "::error::eval gate should have failed on the regressed report"
            exit 1
          fi
          echo "gate correctly blocked the regression"

  # ────────────────────────────────────────────────────────────
  # Docker build (verify image builds)
  # ────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: chronos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
